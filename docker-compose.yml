services:
  postgres:
    image: postgres:16-alpine
    container_name: baserow_lite_db
    restart: unless-stopped
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baserow_lite}
      POSTGRES_USER: ${POSTGRES_USER:-baserow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baserow_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/migrations/0000_third_paper_doll.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command: >
      postgres 
        -c shared_buffers=256MB 
        -c work_mem=8MB 
        -c maintenance_work_mem=64MB 
        -c effective_cache_size=768MB 
        -c max_connections=40 
        -c max_parallel_workers_per_gather=2
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M
    networks:
      - baserow_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baserow_user} -d ${POSTGRES_DB:-baserow_lite}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baserow_lite_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-baserow_user}:${POSTGRES_PASSWORD:-baserow_pass}@postgres:5432/${POSTGRES_DB:-baserow_lite}
      APP_SECRET: ${APP_SECRET:-default_secret_key_change_me_32_bytes}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /app/storage/uploads
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-snadales@gmail.com}
      BI_ALERT_WEBHOOK_URL: ${BI_ALERT_WEBHOOK_URL:-http://192.168.60.25:5678/webhook/bi-alerts}
      ODOO_DB_HOST: ${ODOO_DB_HOST:-odoo20_db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_USER: ${ODOO_DB_USER:-baserow_ro}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-bi_ro_yarken_2026}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo_prod}
      VOZ_DB_HOST: ${VOZ_DB_HOST:-voz-db}
      VOZ_DB_PORT: ${VOZ_DB_PORT:-5432}
      VOZ_DB_USER: ${VOZ_DB_USER:-baserow_ro}
      VOZ_DB_PASSWORD: ${VOZ_DB_PASSWORD:-bi_ro_yarken_2026}
      VOZ_DB_NAME: ${VOZ_DB_NAME:-voz}
      PIMCORE_DB_HOST: ${PIMCORE_DB_HOST:-pimcore-db-1}
      PIMCORE_DB_PORT: ${PIMCORE_DB_PORT:-3306}
      PIMCORE_DB_USER: ${PIMCORE_DB_USER:-baserow_ro}
      PIMCORE_DB_PASSWORD: ${PIMCORE_DB_PASSWORD:-bi_ro_yarken_2026}
      PIMCORE_DB_NAME: ${PIMCORE_DB_NAME:-pimcore}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data/uploads:/app/storage/uploads
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - baserow_internal
      - odoo20_net
      - voz_net
      - pimcore_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  baserow_internal:
    driver: bridge
  odoo20_net:
    external: true
    name: odoo20-network
  voz_net:
    external: true
    name: voz-network
  pimcore_net:
    external: true
    name: pimcore_pim
